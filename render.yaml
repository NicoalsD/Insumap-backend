# Render Blueprint: https://render.com/docs/blueprint-spec
# Database lives in Neon (project raspy-sea-39960827, branch "production").
services:
  - type: web
    name: insumap-backend
    runtime: python
    plan: free
    region: ohio            # closest Render region to Neon us-east-2
    branch: main
    healthCheckPath: /health
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL            # Neon pooled URL (neon connection-string --pooled)
        sync: false
      - key: DATABASE_URL_UNPOOLED   # Neon direct URL, used by Alembic
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS            # frontend URL (Vercel), comma separated
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SEED_DEMO_USERS
        value: "true"
