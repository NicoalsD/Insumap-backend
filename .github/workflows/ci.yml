name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests alembic && uv run ruff format --check app tests alembic
      - name: Types (domain)
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing
