services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: insumap
      POSTGRES_PASSWORD: insumap
      POSTGRES_DB: insumap
    ports:
      - "5432:5432"
    volumes:
      - insumap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insumap"]
      interval: 5s
      retries: 10

volumes:
  insumap-db:
